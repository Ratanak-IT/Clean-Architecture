plugins {
    id 'springboot-common-conventions'
}

dependencies {
    implementation 'org.springframework.boot:spring-boot-starter-webmvc'
    implementation project(':customer-service-restapi')
    implementation 'org.springframework.boot:spring-boot-starter-webflux'
    implementation('kh.edu.istad:customer-service-message')
    implementation('kh.edu.istad:customer-application-service')
    implementation('kh.edu.istad:customer-domain-core')
    implementation('kh.edu.istad:customer-service-persistence')
    implementation('kh.edu.istad:customer-service-restapi')
    runtimeOnly 'org.postgresql:postgresql'
    implementation 'kh.edu.istad:istad-common-restapi'
    implementation 'org.springframework.boot:spring-boot-starter-data-mongodb-reactive'
    implementation 'org.springframework.cloud:spring-cloud-starter-netflix-eureka-client'

}


ext {
    set('springCloudVersion', "2025.1.2")
}

dependencyManagement {
    imports {
        mavenBom "org.springframework.cloud:spring-cloud-dependencies:${springCloudVersion}"
    }
}