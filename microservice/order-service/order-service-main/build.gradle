plugins {
    id 'spring-cloud-common-conventions'
}

dependencyManagement {
    dependencies {
        dependency 'com.google.protobuf:protobuf-java:4.36.2'
        dependency 'com.google.protobuf:protobuf-java-util:4.36.2'
    }
}

dependencies {

    implementation 'kh.edu.istad:istad-common-swagger'
//    implementation libs.springdoc.openapi.starter.webmvc.ui

    implementation 'org.springframework.boot:spring-boot-starter-liquibase'
    runtimeOnly 'org.postgresql:postgresql'
    runtimeOnly 'org.postgresql:r2dbc-postgresql'

    implementation 'org.springframework.boot:spring-boot-starter-webmvc'
    implementation project(':order-service-domain:order-domain-core')
    implementation project(':order-service-domain:order-application-service')
    implementation project(':order-service-client')
    implementation project(':order-service-restapi')
    implementation project(':order-service-persistence')
    implementation 'kh.edu.istad:istad-common-restapi'
    implementation 'org.springframework.boot:spring-boot-starter-actuator'
    implementation 'org.springframework.boot:spring-boot-starter-webflux'
    implementation 'org.springframework.cloud:spring-cloud-starter-consul-config'
    implementation 'org.springframework.cloud:spring-cloud-starter-consul-discovery'

    implementation 'build.buf.gen:iteistad_customer-service_grpc_java:1.85.1.1.20261106032745.bc2a767779f7'
    implementation('build.buf.gen:iteistad_customer-service_protocolbuffers_java:36.2.0.1.20261106032745.bc2a767779f7')

//    implementation 'org.springframework.cloud:spring-cloud-starter-netflix-eureka-client'

    //add anotation liguibase core
    implementation 'org.liquibase:liquibase-core'

    // gRPC
    implementation 'kh.edu.istad:istad-common-grpc'
    implementation 'org.springframework.boot:spring-boot-starter-grpc-server'
    implementation 'org.springframework.boot:spring-boot-starter-grpc-client'
//    implementation 'org.springframework.grpc:spring-grpc-spring-boot-starter'
    testImplementation 'org.springframework.boot:spring-boot-starter-test'
    //security
    implementation 'org.springframework.boot:spring-boot-starter-security'

}
