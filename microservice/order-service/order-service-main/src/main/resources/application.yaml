


spring:
  grpc:
    client:
      channel:
        customer-channel:
          target: 'static://localhost:9090'
          ssl:
            enabled: false


  main:
    web-application-type: reactive
  application:
    name: order-service

  security:
    oauth2:
      client:
        registration:
          customer-client:
            client-id: registrar-client
            client-secret: secret
            authorization-grant-type: client_credentials
            scope:
              - client.read
            client-authentication-method: client_secret_basic
        provider:
          customer-client:
            token-uri: http://localhost:9000/oauth2/token
  http:
    client:
      customer-service:
        base-url: http://customer-service

  config:
    import:
      - "optional:consul:"
  profiles:
    active: dev
  cloud:
    consul:
      config:
        enabled: true
        format: yaml
        watch:
          enabled: true
      discovery:
#        health-check-url: http://host.docker.internal:9191/actuator/health
        instance-id: ${spring.application.name}:${random.int}
  #    discovery:
#      enabled: true

