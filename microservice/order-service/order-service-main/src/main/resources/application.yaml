server:
  port: 4000

spring:
  application:
    name: order-service
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/order_db}
    username: ${DB_USERNAME:postgres}
    password: ${DB_PASSWORD:Ratanak16}
    driver-class-name: org.postgresql.Driver
  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true
    # let Hibernate create the tables first, THEN run data.sql
    defer-datasource-initialization: true
    properties:
      hibernate:
        format_sql: true
  sql:
    init:
      mode: always
  jackson:
    deserialization:
      fail-on-unknown-properties: true

customer-service:
  base-url: ${CUSTOMER_SERVICE_URL:http://localhost:5001}
