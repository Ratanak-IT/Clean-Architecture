server:
  port: 0

spring:
  application:
    name: order-service
  cloud:
    discovery:
      enabled: true

  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/order_db}
    username: ${DB_USERNAME:postgres}
    password: ${DB_PASSWORD:Ratanak16}
    driver-class-name: org.postgresql.Driver
  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true
    # let Hibernate create the tables first, THEN run data.sql
    defer-datasource-initialization: true
    properties:
      hibernate:
        format_sql: true
  sql:
    init:
      mode: always
  jackson:
    deserialization:
      fail-on-unknown-properties: true

eureka:
  client:
    service-url:
      defaultZone: http://localhost:8761/eureka/
  instance:
    prefer-ip-address: true
    instance-id: ${spring.application.name}:${random.int}
    lease-renewal-interval-in-seconds: 10
    lease-expiration-duration-in-seconds: 30
    statusPageUrlPath: /actuator/info
    healthCheckUrlPath: /actuator/health

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      show-details: always

customer-service:
#  base-url: ${CUSTOMER_SERVICE_URL:http://localhost:5001}
  base-url: http://customer-service

business-service:
  base-url: http://business-service

payment-service:
  base-url: http://payment-service

