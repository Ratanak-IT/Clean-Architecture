<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Authorize Application - Authorization Server</title>
    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
    <style>
        body {
            font-family: 'Plus Jakarta Sans', -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
        }
    </style>
    <script>
        function cancelConsent() {
            document.getElementById("consent_action").value = "cancel";
            document.getElementById("consent_form").submit();
        }
    </script>
</head>
<body class="bg-slate-950 text-slate-100 min-h-screen flex items-center justify-center p-4 antialiased selection:bg-indigo-500 selection:text-white">

<div class="relative w-full max-w-lg">
    <!-- Subtle Background Glow -->
    <div class="absolute -top-10 -left-10 w-72 h-72 bg-indigo-500/10 rounded-full blur-3xl pointer-events-none"></div>
    <div class="absolute -bottom-10 -right-10 w-72 h-72 bg-violet-500/10 rounded-full blur-3xl pointer-events-none"></div>

    <div class="relative bg-slate-900/90 backdrop-blur-xl rounded-2xl shadow-2xl border border-slate-800 p-8 sm:p-10">

        <!-- Header / App Connection Visual -->
        <div class="text-center mb-8">
            <div class="flex items-center justify-center space-x-3 mb-5">
                <div class="w-12 h-12 rounded-2xl bg-slate-800 border border-slate-700 flex items-center justify-center text-indigo-400 shadow-md">
                    <svg class="w-6 h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
                              d="M9.75 17L9 20l-1 1h8l-1-1-.75-3M3 13h18M5 17h14a2 2 0 002-2V5a2 2 0 00-2-2H5a2 2 0 00-2 2v10a2 2 0 002 2z"/>
                    </svg>
                </div>
                <div class="flex items-center text-slate-600">
                    <svg class="w-5 h-5 animate-pulse" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M14 5l7 7m0 0l-7 7m7-7H3"/>
                    </svg>
                </div>
                <div class="w-12 h-12 rounded-2xl bg-gradient-to-tr from-indigo-600 to-violet-500 flex items-center justify-center text-white shadow-lg shadow-indigo-500/30">
                    <svg class="w-6 h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
                              d="M16 7a4 4 0 11-8 0 4 4 0 018 0zM12 14a7 7 0 00-7 7h14a7 7 0 00-7-7z"/>
                    </svg>
                </div>
            </div>

            <h1 class="text-2xl font-bold tracking-tight text-white">Authorize Access</h1>
            <p class="text-sm text-slate-400 mt-2">
                <span class="font-semibold text-indigo-300" th:text="${clientName}">Application</span>
                wants to access your account:
            </p>
            <div class="mt-2 inline-flex items-center px-3 py-1 rounded-full text-xs font-medium bg-slate-800 text-slate-300 border border-slate-700">
                <span class="w-2 h-2 rounded-full bg-emerald-400 mr-2"></span>
                Signed in as <span class="font-semibold text-white ml-1" th:text="${principalName}">user</span>
            </div>
        </div>

        <!-- Consent Form -->
        <form id="consent_form" th:action="@{/oauth2/authorize}" method="post" class="space-y-6">

            <input type="hidden" th:if="${_csrf}" th:name="${_csrf.parameterName}" th:value="${_csrf.token}" />
            <input type="hidden" name="client_id" th:value="${clientId}">
            <input type="hidden" name="state" th:value="${state}">
            <input type="hidden" th:if="${userCode}" name="user_code" th:value="${userCode}">
            <input type="hidden" id="consent_action" name="consent_action" value="approve">

            <!-- Previously Approved Scopes (if any) -->
            <div th:if="${not #sets.isEmpty(previouslyApprovedScopes)}" class="space-y-2">
                <h3 class="text-xs font-semibold uppercase tracking-wider text-slate-400">
                    Already Granted
                </h3>
                <div class="bg-slate-950/40 rounded-xl p-3 border border-slate-800 space-y-2">
                    <div th:each="scope : ${previouslyApprovedScopes}" class="flex items-start space-x-3 text-xs">
                        <svg class="w-4 h-4 text-emerald-400 shrink-0 mt-0.5" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M5 13l4 4L19 7"/>
                        </svg>
                        <div>
                            <span class="font-semibold text-slate-200" th:text="${scope.scope}">scope</span>
                            <span class="text-slate-500 ml-1.5" th:text="${scope.description}">description</span>
                        </div>
                    </div>
                </div>
            </div>

            <!-- Scopes to Approve -->
            <div th:if="${not #sets.isEmpty(scopes)}" class="space-y-3">
                <h3 class="text-xs font-semibold uppercase tracking-wider text-slate-400">
                    Permissions Requested
                </h3>
                <div class="space-y-2.5">
                    <div th:each="scope : ${scopes}"
                         class="flex items-start space-x-3.5 p-3.5 rounded-xl bg-slate-950/60 border border-slate-800 hover:border-slate-700/80 transition">
                        <div class="flex items-center h-5 mt-0.5">
                            <input type="checkbox"
                                   name="scope"
                                   th:value="${scope.scope}"
                                   th:id="${scope.scope}"
                                   checked
                                   class="w-4 h-4 text-indigo-600 bg-slate-900 border-slate-700 rounded focus:ring-indigo-500 focus:ring-2 cursor-pointer">
                        </div>
                        <label th:for="${scope.scope}" class="text-sm cursor-pointer select-none">
                            <span class="font-medium text-white" th:text="${scope.scope}">scope</span>
                            <p class="text-xs text-slate-400 mt-0.5" th:text="${scope.description}">Scope description</p>
                        </label>
                    </div>
                </div>
            </div>

            <!-- Action Buttons -->
            <div class="pt-2 flex flex-col sm:flex-row gap-3">
                <button type="submit"
                        class="w-full py-3 px-4 bg-gradient-to-r from-indigo-600 to-violet-600 hover:from-indigo-500 hover:to-violet-500 text-white font-semibold rounded-xl shadow-lg shadow-indigo-600/30 hover:shadow-indigo-600/50 transition duration-200 cursor-pointer">
                    Allow Access
                </button>
                <button type="button"
                        onclick="cancelConsent()"
                        class="w-full sm:w-auto py-3 px-5 bg-slate-800 hover:bg-slate-700 border border-slate-700 hover:border-slate-600 text-slate-300 hover:text-white font-medium rounded-xl transition duration-200 cursor-pointer text-center">
                    Cancel
                </button>
            </div>
        </form>

        <!-- Security Disclaimer -->
        <div class="mt-8 pt-6 border-t border-slate-800 text-center">
            <p class="text-xs text-slate-500 leading-relaxed">
                By allowing access, you authorize this application to utilize your information in accordance with their terms and privacy policies.
            </p>
        </div>
    </div>
</div>

</body>
</html>
