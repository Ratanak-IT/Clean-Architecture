<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sign In - Authorization Server</title>
    <!-- Tailwind CSS CDN for modern, clean styling -->
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-slate-900 text-slate-100 flex items-center justify-center min-h-screen">

<div class="w-full max-w-md p-8 bg-slate-800 rounded-2xl shadow-xl border border-slate-700">

    <!-- Header / Logo -->
    <div class="text-center mb-8">
        <h1 class="text-3xl font-bold tracking-tight text-white">Welcome Back</h1>
        <p class="text-sm text-slate-400 mt-2">Sign in to your account to continue</p>
    </div>

    <!-- Error Alert (Displayed if authentication fails) -->
    <div th:if="${param.error}" class="mb-6 p-4 bg-red-950/50 border border-red-800/50 text-red-300 text-sm rounded-lg flex items-center space-x-2">
        <svg class="w-5 h-5 text-red-400 shrink-0" fill="none" stroke="currentColor" viewBox="0 0 24 24">
            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 9v2m0 4h.01m-6.938 4h13.856c1.54 0 2.502-1.667 1.732-3L13.732 4c-.77-1.333-2.694-1.333-3.464 0L3.34 16c-.77 1.333.192 3 1.732 3z"/>
        </svg>
        <span>Invalid username or password. Please try again.</span>
    </div>

    <!-- Logout Success Alert -->
    <div th:if="${param.logout}" class="mb-6 p-4 bg-emerald-950/50 border border-emerald-800/50 text-emerald-300 text-sm rounded-lg">
        You have been successfully logged out.
    </div>

    <!-- Login Form -->
    <form th:action="@{/login}" method="post" class="space-y-5">

        <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}" />

        <div>
            <label class="block text-sm font-medium text-slate-300 mb-1.5" for="username">Username</label>
            <input type="text" id="username" name="username" required autofocus
                   class="w-full px-4 py-2.5 bg-slate-900 border border-slate-700 rounded-lg text-white placeholder-slate-500 focus:outline-none focus:border-indigo-500 focus:ring-1 focus:ring-indigo-500 transition">
        </div>

        <div>
            <label class="block text-sm font-medium text-slate-300 mb-1.5" for="password">Password</label>
            <input type="password" id="password" name="password" required
                   class="w-full px-4 py-2.5 bg-slate-900 border border-slate-700 rounded-lg text-white placeholder-slate-500 focus:outline-none focus:border-indigo-500 focus:ring-1 focus:ring-indigo-500 transition">
        </div>

        <button type="submit"
                class="w-full py-3 px-4 bg-indigo-600 hover:bg-indigo-500 text-white font-medium rounded-lg shadow-lg shadow-indigo-600/30 transition duration-200">
            Sign In
        </button>
    </form>

    <!-- Divider -->
    <div class="relative my-6">
        <div class="absolute inset-0 flex items-center">
            <div class="w-full border-t border-slate-700"></div>
        </div>
        <div class="relative flex justify-center text-xs uppercase">
            <span class="bg-slate-800 px-3 text-slate-400 font-medium">Or continue with</span>
        </div>
    </div>

    <!-- GitHub OAuth2 Button -->
    <a th:href="@{/oauth2/authorization/github}"
       class="w-full flex items-center justify-center gap-3 py-2.5 px-4 bg-slate-900 hover:bg-slate-700 border border-slate-700 text-white font-medium rounded-lg transition duration-200 shadow-md">
        <!-- GitHub SVG Icon -->
        <svg class="w-5 h-5 fill-current" viewBox="0 0 24 24">
            <path fill-rule="evenodd" clip-rule="evenodd"
                  d="M12 2C6.477 2 2 6.484 2 12.017c0 4.425 2.865 8.18 6.839 9.504.5.092.682-.217.682-.483 0-.237-.008-.868-.013-1.703-2.782.605-3.369-1.343-3.369-1.343-.454-1.158-1.11-1.466-1.11-1.466-.908-.62.069-.608.069-.608 1.003.07 1.53 1.032 1.53 1.032.892 1.53 2.341 1.088 2.91.832.092-.647.35-1.088.636-1.338-2.22-.253-4.555-1.113-4.555-4.951 0-1.093.39-1.988 1.029-2.688-.103-.253-.446-1.272.098-2.65 0 0 .84-.27 2.75 1.026A9.564 9.564 0 0112 6.844c.85.004 1.705.115 2.504.337 1.909-1.296 2.747-1.027 2.747-1.027.546 1.379.202 2.398.1 2.651.64.7 1.028 1.595 1.028 2.688 0 3.848-2.339 4.695-4.566 4.943.359.309.678.92.678 1.855 0 1.338-.012 2.419-.012 2.747 0 .268.18.58.688.482A10.019 10.019 0 0022 12.017C22 6.484 17.522 2 12 2z"/>
        </svg>
        <span>Sign in with GitHub</span>
    </a>

    <a href="/oauth2/authorization/google" class="btn-google">
        Sign in with Google
    </a>

    <div class="mt-8 text-center text-xs text-slate-500">
        Secure Spring Authorization Server Portal
    </div>
</div>

</body>
</html>
