<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org" xmlns:sec="http://www.thymeleaf.org/extras/spring-security">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Home Portal - Authorization Server</title>
    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
    <style>
        body {
            font-family: 'Plus Jakarta Sans', -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
        }
    </style>
</head>
<body class="bg-slate-950 text-slate-100 min-h-screen flex items-center justify-center p-4 antialiased selection:bg-indigo-500 selection:text-white">

<div class="relative w-full max-w-xl">
    <!-- Subtle Background Glow -->
    <div class="absolute -top-10 -left-10 w-72 h-72 bg-indigo-500/10 rounded-full blur-3xl pointer-events-none"></div>
    <div class="absolute -bottom-10 -right-10 w-72 h-72 bg-violet-500/10 rounded-full blur-3xl pointer-events-none"></div>

    <div class="relative bg-slate-900/90 backdrop-blur-xl rounded-2xl shadow-2xl border border-slate-800 p-8 sm:p-10">

        <!-- Header -->
        <div class="text-center mb-8">
            <div class="inline-flex items-center justify-center w-14 h-14 rounded-2xl bg-gradient-to-tr from-emerald-600 to-teal-500 text-white shadow-lg shadow-emerald-500/30 mb-4">
                <svg class="w-7 h-7" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M5 13l4 4L19 7"/>
                </svg>
            </div>
            <h1 class="text-2xl sm:text-3xl font-bold tracking-tight text-white">Signed In Successfully</h1>
            <p class="text-sm text-slate-400 mt-2">Welcome to ISTAD Authorization Server Portal</p>
        </div>

        <!-- User Information Box -->
        <div class="bg-slate-950/60 rounded-xl p-5 border border-slate-800 mb-6">
            <div class="flex items-center space-x-3 mb-2">
                <div class="w-10 h-10 rounded-full bg-indigo-600/20 text-indigo-400 flex items-center justify-center font-bold text-lg">
                    <span th:text="${#strings.substring(username, 0, 1).toUpperCase()}">U</span>
                </div>
                <div>
                    <h3 class="text-sm font-semibold text-white" th:text="${username}">Username</h3>
                    <p class="text-xs text-emerald-400 flex items-center">
                        <span class="w-2 h-2 rounded-full bg-emerald-400 inline-block mr-1.5"></span>
                        Authenticated Session Active
                    </p>
                </div>
            </div>
        </div>

        <!-- OAuth2 Consent Test Section -->
        <div class="bg-indigo-950/30 border border-indigo-800/40 rounded-xl p-6 mb-6">
            <div class="flex items-start space-x-3">
                <div class="p-2 bg-indigo-600/20 text-indigo-400 rounded-lg shrink-0 mt-0.5">
                    <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
                              d="M9 12l2 2 4-4m5.618-4.016A11.955 11.955 0 0112 2.944a11.955 11.955 0 01-8.618 3.04A12.02 12.02 0 003 9c0 5.591 3.824 10.29 9 11.622 5.176-1.332 9-6.03 9-11.622 0-1.042-.133-2.052-.382-3.016z"/>
                    </svg>
                </div>
                <div>
                    <h4 class="text-sm font-semibold text-white">OAuth2 Consent Screen Test</h4>
                    <p class="text-xs text-slate-300 mt-1 leading-relaxed">
                        To test and view the Consent page, an OAuth2 Client must request access with scopes. Click below to launch the authorization flow:
                    </p>
                </div>
            </div>

            <div class="mt-4">
                <a th:href="@{/oauth2/authorize(response_type='code', client_id='oidc-client', scope='openid profile email', redirect_uri='http://localhost:9000/callback', code_challenge='E9Melhoa2OwvFrGMTJguCH5rtG6j5D-qwqqKAa8_EzQ', code_challenge_method='S256', state='test-state-123')}"
                   class="w-full inline-flex items-center justify-center py-3 px-4 bg-gradient-to-r from-indigo-600 to-violet-600 hover:from-indigo-500 hover:to-violet-500 text-white font-semibold rounded-xl shadow-lg shadow-indigo-600/30 transition duration-200 text-sm cursor-pointer">
                    <svg class="w-4 h-4 mr-2" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M14 5l7 7m0 0l-7 7m7-7H3"/>
                    </svg>
                    Open OAuth2 Consent Screen
                </a>
            </div>
        </div>

        <!-- Logout Form -->
        <form th:action="@{/logout}" method="post" class="text-center">
            <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}" />
            <button type="submit"
                    class="text-xs font-medium text-slate-400 hover:text-red-400 hover:underline transition cursor-pointer">
                Sign Out of Account
            </button>
        </form>

    </div>
</div>

</body>
</html>
