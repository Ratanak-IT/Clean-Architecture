plugins {
    id 'springboot-common-conventions'
}

dependencies {
    implementation 'org.springframework.boot:spring-boot-starter-webflux'
    implementation 'kh.edu.istad:business-domain-core'
    implementation 'kh.edu.istad:business-application-service'
    implementation 'kh.edu.istad:business-service-restapi'
    implementation 'kh.edu.istad:business-service-persistence'
    implementation 'org.springframework.boot:spring-boot-starter-actuator'
    implementation 'org.springframework.cloud:spring-cloud-starter-netflix-eureka-client'
}

ext {
    set('springCloudVersion', "2025.1.2")
}

dependencyManagement {
    imports {
        mavenBom "org.springframework.cloud:spring-cloud-dependencies:${springCloudVersion}"
    }
}