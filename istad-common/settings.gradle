pluginManagement {
    includeBuild('../build-logic')

    repositories {
        gradlePluginPortal()
        mavenCentral()
    }
}

dependencyResolutionManagement {
    repositories {
        mavenCentral()
        maven {
            name = 'buf'
            url 'https://buf.build/gen/maven'
        }
    }

    versionCatalogs {
        libs {
            from(files('../gradle/libs.versions.toml'))
        }
    }
}


rootProject.name = 'istad-common'
include 'istad-common-domain'
include 'istad-common-restapi'
include 'istad-common-persistence'
include 'istad-common-swagger'
include 'istad-common-grpc'
include 'istad-common-webflux'