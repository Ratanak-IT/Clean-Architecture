syntax = "proto3";

package customer;

option java_package = "kh.edu.istad.customerservice.grpc";
option java_multiple_files = true;

service CustomerService {
  rpc GetCustomerById (GetCustomerRequest) returns (CustomerGetResponse);
  rpc GetAllCustomer (GetAllCustomerRequest) returns (stream CustomerGetResponse);
  rpc GetCustomerByUsername (GetCustomerByUsernameRequest) returns (CustomerGetResponse);
}

message GetCustomerRequest {
  string id = 1;
}

message GetAllCustomerRequest {}

message GetCustomerByUsernameRequest {
  string username = 1;
}

message CustomerGetResponse {
  string customer_id = 1;
  string username = 2;
  string family_name = 3;
  string given_name = 4;
  string email = 5;
  string phone_number = 6;
  string customer_status = 7;
  string segment = 8;
}