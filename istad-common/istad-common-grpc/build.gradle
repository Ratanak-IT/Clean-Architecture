plugins {
    id 'java-common-conventions'
    id 'com.google.protobuf' version '0.9.6'
}

repositories {
    mavenCentral()
    maven {
        name = 'buf'
        url 'https://buf.build/gen/maven'
    }
}

protobuf {
    protoc {
        artifact = 'com.google.protobuf:protoc:4.29.3'
    }
    plugins {
        grpc {
            artifact = 'io.grpc:protoc-gen-grpc-java:1.70.0'
        }
    }
    generateProtoTasks {
        all()*.plugins {
            grpc {}
        }
    }
}

dependencies {
    api 'io.grpc:grpc-protobuf:1.70.0'
    api 'io.grpc:grpc-stub:1.70.0'
    api 'com.google.protobuf:protobuf-java:4.29.3'
    implementation libs.bundles.grpc
    compileOnly libs.tomcat.annotations.api
    compileOnly 'org.apache.tomcat:annotations-api:6.0.53'
    implementation 'build.buf.gen:iteistad_customer-service_grpc_java:1.85.1.1.20261106032745.bc2a767779f7'
    implementation('build.buf.gen:iteistad_customer-service_protocolbuffers_java:36.2.0.1.20261106032745.bc2a767779f7')
}
