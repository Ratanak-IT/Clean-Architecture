volumes:
  consul_vol:

version: '3.7'
services:
  consul-server1:
    image: hashicorp/consul:latest
    container_name: consul-server
    restart: always
    networks:
      - consul-net
    ports:
      - "8500:8500"
#      - "8600:8600/tcp"
#      - "8600:8600/udp"
    command: "agent -server -ui -client=0.0.0.0 -data-dir='/consul/data' -node=consul-server -bootstrap-expect=1"
    volumes:
      - consul_vol:/consul/data

networks:
  consul-net:
    external: true

